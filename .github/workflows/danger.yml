name: Danger

# pull_request_target gives this workflow a token that can comment on pull requests, including
# those from forks. In exchange it must never run the pull request's code: it checks out the base
# branch (the default for this event), so the Dangerfile and every tool it builds come from code
# already merged, and Danger reads the pull request only as data through the GitHub API.
# Building and testing the pull request happens in ios-tests.yml and platforms.yml, which use the
# pull_request event with a read-only token.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited, assigned, unassigned]
    branches:
      - main

permissions: {}

concurrency:
  group: danger-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  danger:
    name: Danger
    permissions:
      contents: read
      pull-requests: write
      issues: write
      statuses: write
    runs-on: macos-latest
    timeout-minutes: 20

    steps:
      - name: Checkout the base branch
        # Do not add a ref: the pull request's head would run with this job's write token.
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Fetch the Danger package
        env:
          # Pinned: this code is built and run with the write token.
          DANGER_SWIFT_REPO: https://github.com/DebugSwift/DangerSwift
          DANGER_SWIFT_SHA: 40173f82d65ee135cfd08bbb154fd49989a93e06
        run: |
          git init -q .danger
          git -C .danger fetch -q --depth 1 "$DANGER_SWIFT_REPO" "$DANGER_SWIFT_SHA"
          git -C .danger checkout -q FETCH_HEAD
          cp Dangerfile.swift .danger/

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Run Danger
        working-directory: .danger
        run: |
          npm install -g danger@13.0.10
          swift build
          swift run danger-swift ci --verbose
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DANGER_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DANGER_SWIFT_NO_UPDATE_CHECK: "1"
