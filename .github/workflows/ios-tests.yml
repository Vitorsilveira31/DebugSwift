name: iOS tests

# Runs the code of the pull request, so it gets the pull_request event: a read-only token and no
# secrets, even for pull requests from forks. Danger, which needs a token that can comment, runs in
# danger.yml and never checks out or executes the pull request's code.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  example-tests:
    name: Example tests (iOS simulator)
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          # The package and the Example need iOS 17 and Swift 6; use the image's newest Xcode
          # so its simulators match what the test lane picks.
          xcode-version: latest-stable

      - name: Run the Example tests
        env:
          # fastlane fails to decode xcodebuild output without a UTF-8 locale.
          LANG: en_US.UTF-8
          LC_ALL: en_US.UTF-8
        run: |
          cd Example
          bundle install
          bundle exec fastlane test

      - name: Report coverage
        if: ${{ !cancelled() && hashFiles('Example/fastlane/test_output/Example.xcresult/Info.plist') != '' }}
        run: |
          {
            echo "### Coverage"
            echo '```'
            xcrun xccov view --report --only-targets Example/fastlane/test_output/Example.xcresult
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the result bundle on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: example-xcresult
          path: Example/fastlane/test_output/Example.xcresult
          if-no-files-found: ignore
          retention-days: 7

  swiftlint:
    name: SwiftLint (changed files)
    if: github.event_name == 'pull_request'
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          # The merge commit and its first parent, the base branch, to list the changed files.
          fetch-depth: 2

      - name: Install SwiftLint
        run: command -v swiftlint || brew install swiftlint

      - name: Lint the changed Swift files
        # Violations appear as annotations on the pull request; error-level ones fail the job.
        run: |
          files=()
          while IFS= read -r file; do files+=("$file"); done < <(
            git diff --name-only --diff-filter=d HEAD^1 HEAD -- 'DebugSwift/*.swift'
          )
          if [ ${#files[@]} -eq 0 ]; then
            echo "No Swift file under DebugSwift/ changed."
            exit 0
          fi
          printf 'Linting %s\n' "${files[@]}"
          swiftlint lint --config .swiftlint.yml --force-exclude --reporter github-actions-logging -- "${files[@]}"
